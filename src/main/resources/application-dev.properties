spring.config.import=optional:file:.env.dev[.properties]

spring.datasource.url=jdbc:postgresql://${DB_HOST:global_postgres_db}:${DB_PORT:5432}/${DB_NAME:pikudo_db}

spring.jpa.show-sql=${JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=${JPA_FORMAT_SQL:true}
logging.level.com.pikudo=${APP_LOG_LEVEL:DEBUG}
logging.level.org.hibernate.SQL=${HIBERNATE_SQL_LOG_LEVEL:DEBUG}
logging.level.org.hibernate.orm.jdbc.bind=${HIBERNATE_BIND_LOG_LEVEL:INFO}

management.endpoints.web.exposure.include=health,info,env,metrics,loggers
