spring.application.name=Pikudo_Chicken2
spring.profiles.default=local

# PostgreSQL is the source of truth. Values come from profile-specific .env files
# or environment variables provided by Docker/host OS.
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:pikudo_db}
spring.datasource.username=${DB_USERNAME:pikudo_app}
spring.datasource.password=${DB_PASSWORD:}

# Flyway owns schema changes. Hibernate must not mutate the database.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# API docs are enabled by default outside prod.
springdoc.api-docs.enabled=${OPENAPI_ENABLED:true}
springdoc.swagger-ui.enabled=${OPENAPI_ENABLED:true}

# Security and runtime defaults. Secrets must be provided by .env or the host.
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}
jwt.issuer=${JWT_ISSUER:pikudo-api}
jwt.audience=${JWT_AUDIENCE:pikudo-clients}
app.security.refresh-token.expiration-millis=${REFRESH_TOKEN_EXPIRATION:604800000}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://localhost:1420}

# Optional initial admin seed. Disabled unless the active .env enables it.
app.seed.admin.enabled=${ADMIN_SEED_ENABLED:false}
app.seed.admin.username=${ADMIN_USERNAME:}
app.seed.admin.password=${ADMIN_PASSWORD:}
app.seed.admin.nombre=${ADMIN_NOMBRE:}
app.seed.admin.apellido=${ADMIN_APELLIDO:}
app.seed.admin.dni=${ADMIN_DNI:}
app.seed.admin.telefono=${ADMIN_TELEFONO:}

# Storage.
app.storage.provider=${APP_STORAGE_PROVIDER:local}
app.storage.local.base-path=${APP_STORAGE_LOCAL_BASE_PATH:uploads}

# Google Drive integration. Disabled by default until Fase 3 implements the provider.
app.storage.google-drive.enabled=${GOOGLE_DRIVE_ENABLED:false}
app.storage.google-drive.oauth-client-id=${DRIVE_OAUTH_CLIENT_ID:}
app.storage.google-drive.oauth-client-secret=${DRIVE_OAUTH_CLIENT_SECRET:}
app.storage.google-drive.oauth-refresh-token=${DRIVE_OAUTH_REFRESH_TOKEN:}
app.storage.google-drive.folders.products=${DRIVE_FOLDERS_PRODUCTS:}
app.storage.google-drive.folders.avatar-users=${DRIVE_FOLDERS_AVATAR_USERS:}
app.storage.google-drive.folders.delivery-evidence=${DRIVE_FOLDERS_DELIVERY_EVIDENCE:}
app.storage.google-drive.folders.sunat-root=${DRIVE_FOLDERS_SUNAT_ROOT:}

# Email integration. Resend API is the target provider; SMTP is legacy fallback config only.
app.email.resend.enabled=${RESEND_ENABLED:false}
app.email.resend.api-key=${RESEND_API_KEY:}
app.email.resend.from-email=${RESEND_FROM_EMAIL:}
app.email.smtp.host=${SMTP_HOST:}
app.email.smtp.port=${SMTP_PORT:587}
app.email.smtp.user=${SMTP_USER:}
app.email.smtp.password=${SMTP_PASSWORD:}

# External integrations.
sunat.api.url=${SUNAT_API_URL:https://api.apis.net.pe/v2/sunat/ruc?numero=}
app.sunat.enabled=${SUNAT_ENABLED:false}
app.sunat.mode=${SUNAT_MODE:disabled}
app.sunat.ruc=${SUNAT_RUC:}
app.sunat.sol-username=${SUNAT_SOL_USERNAME:}
app.sunat.sol-password=${SUNAT_SOL_PASSWORD:}
app.sunat.pfx-base64=${SUNAT_PFX_BASE64:}
app.sunat.pfx-password=${SUNAT_PFX_PASSWORD:}
app.sunat.endpoint-beta=${SUNAT_ENDPOINT_BETA:}
app.sunat.endpoint-prod=${SUNAT_ENDPOINT_PROD:}

# Infrastructure endpoints reserved for Redis/Kafka integration phases.
app.redis.host=${REDIS_HOST:localhost}
app.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

# Actuator base.
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
