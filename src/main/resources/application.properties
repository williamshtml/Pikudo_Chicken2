spring.application.name=Pikudo_Chicken2

# CONFIGURACI\u00d3N DEL CONECTOR CON MYSQL WORKBENCH
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/pikudo_chicken_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=mysql

# CONTROL DE CREACI\u00d3N AUTOM\u00c1TICA DE TABLAS (JPA / HIBERNATE)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# API SUNAT
sunat.api.url=https://api.apis.net.pe/v2/sunat/ruc?numero=