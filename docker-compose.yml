services:
  pikudo-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: pikudo-chicken-api:phase1
    container_name: pikudo-api
    env_file:
      - path: .env.docker
        required: false
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-docker}
      DB_HOST: ${DB_HOST:-global_postgres_db}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-pikudo_db}
      DB_USERNAME: ${DB_USERNAME:-pikudo_app}
      DB_PASSWORD: ${DB_PASSWORD:-}
      JWT_SECRET: ${JWT_SECRET:-change_me_docker_jwt_secret_at_least_32_chars}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-86400000}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:3000,http://localhost:1420}
      REDIS_HOST: ${REDIS_HOST:-redis}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
      SUNAT_API_URL: ${SUNAT_API_URL:-https://api.apis.net.pe/v2/sunat/ruc?numero=}
    ports:
      - "8080:8080"
    depends_on:
      - redis
      - kafka
    networks:
      - pikudo_postgres_net
      - pikudo_app_net

  redis:
    image: redis:7.4-alpine
    container_name: pikudo-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - pikudo_app_net

  kafka:
    image: bitnami/kafka:3.9
    container_name: pikudo-kafka
    environment:
      KAFKA_CFG_NODE_ID: 1
      KAFKA_CFG_PROCESS_ROLES: broker,controller
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "true"
      ALLOW_PLAINTEXT_LISTENER: "yes"
    ports:
      - "9092:9092"
    volumes:
      - kafka_data:/bitnami/kafka
    networks:
      - pikudo_app_net

volumes:
  redis_data:
  kafka_data:

networks:
  pikudo_app_net:
    name: pikudo_app_net
  pikudo_postgres_net:
    external: true
    name: pikudo_postgres_net
